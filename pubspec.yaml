name: trainer_app
description: Помощник тренера - мобильное приложение
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP
  dio: ^5.4.0
  
  # State management
  provider: ^6.1.1
  
  # Local storage
  shared_preferences: ^2.2.2
  
  # Navigation
  go_router: ^13.2.0
  
  # JWT decode
  jwt_decoder: ^2.0.1
  
  # Date formatting
  intl: ^0.18.1

  # Russian calendar (Monday-first week, localized month names) for showDatePicker
  flutter_localizations:
    sdk: flutter

  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^18.0.1
  socket_io_client: ^2.0.3+1
  google_mlkit_pose_detection: ^0.14.0
  camera: ^0.11.0+2
  video_player: ^2.9.2
  gal: 2.1.4
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0
  flutter_web_auth_2: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: true
  ios: false
  web:
    generate: true
    image_path: "assets/icon.png"
